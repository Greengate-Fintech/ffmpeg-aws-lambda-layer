AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: >
  Pinned static build of FFmpeg/FFprobe for Amazon Linux 2023 (x86_64 or arm64)

  Check out https://github.com/serverlesspub/ffmpeg-aws-lambda-layer
  for more information.
Parameters:
  LayerName:
    Type: String
    Default: ffmpeg
    Description: Name of the Lambda layer (ffmpeg for x86_64, ffmpeg-arm64 for arm64)
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues:
      - x86_64
      - arm64
    Description: Architecture of the binaries in the layer content
Resources:
  LambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Ref LayerName
      Description: FFMPEG for AWS Lambda
      ContentUri: build/layer
      CompatibleRuntimes:
        - nodejs24.x
        - nodejs22.x
        - python3.13
      CompatibleArchitectures:
        - !Ref Architecture
      LicenseInfo: GPL-2.0-or-later
      RetentionPolicy: Retain

Outputs:
  LayerVersion:
    Description: Layer ARN Reference
    Value: !Ref LambdaLayer

Metadata:
  AWS::ServerlessRepo::Application:
    Name: ffmpeg-lambda-layer
    Description: >
      Pinned static build of FFmpeg/FFprobe for Amazon Linux 2023,
      packaged as a Lambda layer. The bundled version is set in versions.mk
    Author: Gojko Adzic
    SpdxLicenseId: GPL-2.0-or-later
    LicenseUrl: LICENSE.txt
    ReadmeUrl: README-SAR.md 
    Labels: ['layer', 'lambda', 'ffmpeg', 'ffprobe']
    HomePageUrl: https://github.com/serverlesspub/ffmpeg-aws-lambda-layer
    SemanticVersion: 1.0.0
    SourceCodeUrl: https://github.com/serverlesspub/ffmpeg-aws-lambda-layer
